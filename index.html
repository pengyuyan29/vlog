<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="林晚的个人博客 - 记录代码、思考与生活">
    <title>素笺 — 林晚的笔记</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <meta property="og:title" content="素笺 — 林晚的笔记">
    <meta property="og:description" content="一个安静的个人数字花园">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pengyuyan29.github.io/vlog">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=ST+Song:wght@400;500&display=swap');
        
        :root { --accent: 165 243 252; }
        
        .tail-container { font-family: 'Inter', system-ui, sans-serif; }
        .article-title { font-family: 'ST Song', Georgia, serif; }
        
        .hero-bg {
            background: linear-gradient(135deg, #0a0a0a 0%, #111113 100%);
        }
        
        .card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px -15px rgb(0 0 0 / 0.5);
        }
        
        .nav-link {
            position: relative;
        }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -3px;
            left: 0;
            background-color: rgb(165 243 252);
            transition: all 0.3s ease;
        }
        .nav-link:hover:after { width: 100%; }
        
        .modal {
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.85) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="tail-container bg-zinc-950 text-zinc-200">
    <!-- 顶部导航 -->
    <nav class="bg-zinc-950 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-cyan-300 rounded-2xl flex items-center justify-center text-zinc-950 font-bold text-2xl">素</div>
                <span class="font-semibold tracking-wider text-2xl">素笺</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="nav-link text-cyan-300">首页</a>
                <a href="#" class="nav-link hover:text-white">开发</a>
                <a href="#" class="nav-link hover:text-white">思考</a>
                <a href="#" class="nav-link hover:text-white">生活</a>
                <a href="#" onclick="showAbout();return false" class="nav-link hover:text-white">关于</a>
            </div>
            
            <div class="flex items-center gap-4">
                <div onclick="toggleSearch()" class="w-9 h-9 flex items-center justify-center hover:bg-zinc-900 rounded-xl cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-bg pt-20 pb-24 text-center">
        <div class="max-w-3xl mx-auto px-6">
            <h1 class="text-6xl md:text-7xl font-medium article-title leading-none mb-6">
                写一点<br>有温度的字
            </h1>
            <p class="text-zinc-400 text-lg max-w-md mx-auto">
                林晚的个人空间。<br>记录代码、思考、生活与成长。
            </p>
            <div class="mt-10">
                <button onclick="document.getElementById('posts-section').scrollIntoView({ behavior: 'smooth' })" 
                        class="bg-white text-zinc-900 px-10 py-4 rounded-2xl font-medium hover:bg-cyan-200 transition">
                    浏览文章 ↓
                </button>
            </div>
        </div>
    </header>

    <div id="posts-section" class="max-w-6xl mx-auto px-6 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="posts-container">
            <!-- 文章由 JS 生成 -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black py-12 border-t border-zinc-900 text-center text-zinc-500 text-sm">
        <p>© 2025 林晚 · 素笺</p>
        <p class="mt-2 text-xs">Hosted on GitHub Pages • Built with Tailwind CSS</p>
    </footer>

    <!-- 阅读弹窗 -->
    <div id="modal" onclick="if(event.target.id==='modal')closeModal()" 
         class="hidden fixed inset-0 bg-black/90 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal bg-zinc-900 w-full max-w-3xl max-h-[90vh] overflow-auto rounded-3xl">
            <div class="sticky top-0 bg-zinc-900 p-6 border-b border-zinc-700 flex justify-between items-center">
                <button onclick="closeModal()" class="text-cyan-300 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> 返回
                </button>
            </div>
            <div class="p-8 md:p-12">
                <div id="modal-date" class="text-xs text-zinc-500"></div>
                <h1 id="modal-title" class="article-title text-4xl font-medium mt-2 leading-tight"></h1>
                <div id="modal-content" class="prose prose-invert mt-10 leading-relaxed text-zinc-300"></div>
            </div>
        </div>
    </div>

    <script>
        const posts = [
            {id:1,title:"如何写出真正优雅的 Tailwind CSS",excerpt:"不再堆砌 className，谈谈组件抽象与设计系统实践。",date:"2025.07.28",readTime:"12 min",image:"🧩"},
            {id:2,title:"我为什么开始使用 Obsidian 作为第二大脑",excerpt:"从 Notion 到 Obsidian 的转变，以及我的知识网络构建方法。",date:"2025.07.15",readTime:"8 min",image:"📓"},
            {id:3,title:"慢下来，才看得见",excerpt:"每周「无屏幕日」让我重新找回了生活的质感。",date:"2025.07.03",readTime:"15 min",image:"🌿"},
        ];

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = posts.map(post => `
                <div onclick="openPost(${post.id})" class="card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden cursor-pointer">
                    <div class="h-64 bg-zinc-800 flex items-center justify-center text-8xl">${post.image}</div>
                    <div class="p-8">
                        <h3 class="article-title text-2xl font-medium leading-tight">${post.title}</h3>
                        <p class="text-zinc-400 mt-4 text-sm">${post.excerpt}</p>
                        <div class="flex justify-between text-xs text-zinc-500 mt-8">
                            <div>${post.date}</div>
                            <div>${post.readTime}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openPost(id) {
            const post = posts.find(p => p.id === id);
            document.getElementById('modal-title').textContent = post.title;
            document.getElementById('modal-date').textContent = `${post.date} · ${post.readTime} 阅读`;
            document.getElementById('modal-content').innerHTML = `
                <p class="mb-6">${post.excerpt}</p>
                <p class="text-zinc-400">（这是演示内容，你可以继续在此处补充完整文章）</p>
                <div class="mt-16 text-center text-xs text-zinc-500">感谢阅读</div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function toggleSearch() {
            alert("搜索功能开发中～");
        }

        function showAbout() {
            document.getElementById('modal-title').innerHTML = '关于我';
            document.getElementById('modal-date').innerHTML = '林晚 · 2025';
            document.getElementById('modal-content').innerHTML = `
                <p class="leading-relaxed">你好，我是林晚。</p>
                <p class="mt-6 leading-relaxed">这里是我的个人数字花园，记录技术、思考与生活。</p>
                <p class="mt-6 text-cyan-400">欢迎来到我的世界。</p>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        window.onload = renderPosts;
    </script>
</body>
</html>
